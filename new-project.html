<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' blob: data:; style-src 'self'; script-src 'self'" />
    <link rel="stylesheet" href="/src/tokens.css" />
    <link rel="stylesheet" href="/src/components.css" />
    <link rel="stylesheet" href="/src/new-project.css" />
    <link rel="stylesheet" href="/src/project-chooser.css" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <title>新建项目</title>
  </head>
  <body class="new-project-window">
    <form id="new-project-window-form">
      <header>
        <h1>新建皮肤</h1>
        <p>选择一个内置模板作为皮肤起点。</p>
        <p class="usage-note">内置皮肤来自互联网整理，仅供技术交流，请勿商用。<br />如有侵权，请联系作者下架。</p>
      </header>
      <section class="templates" aria-labelledby="template-heading">
        <div id="template-heading" class="template-heading">内置模板 <span>8 款可选</span></div>
        <div class="template-list" role="radiogroup" aria-labelledby="template-heading">
        <label class="template-option">
          <input type="radio" name="project-template" value="default-android" checked />
          <span><strong>百度 BDA 默认</strong><small>官方 · 新版 .bda 格式</small></span>
        </label>
        <label class="template-option">
          <input type="radio" name="project-template" value="official-android-bds" />
          <span><strong>百度 BDS 旧版</strong><small>官方 · 经典 .bds 皮肤</small></span>
        </label>
        <label class="template-option">
          <input type="radio" name="project-template" value="xiaomi-unified-rounded-blur" />
          <span><strong>小米统一圆角</strong><small>互联网整理 · .bds</small></span>
        </label>
        <label class="template-option">
          <input type="radio" name="project-template" value="oppo-dual-color" />
          <span><strong>OPPO 双色</strong><small>互联网整理 · .bds</small></span>
        </label>
        <label class="template-option">
          <input type="radio" name="project-template" value="iqoo-rounded-black" />
          <span><strong>iQOO 圆角黑</strong><small>互联网整理 · .bds</small></span>
        </label>
        <label class="template-option">
          <input type="radio" name="project-template" value="huawei-swipe-symbols-1080" />
          <span><strong>华为滑动符号</strong><small>互联网整理 · .bds</small></span>
        </label>
        <label class="template-option">
          <input type="radio" name="project-template" value="oppo-swipe-down" />
          <span><strong>OPPO 皮肤加下滑</strong><small>互联网整理 · .bds</small></span>
        </label>
        <label class="template-option">
          <input type="radio" name="project-template" value="palm-harmony" />
          <span><strong>手心鸿蒙内置</strong><small>互联网整理 · .sxi</small></span>
        </label>
        </div>
      </section>
      <footer>
        <p id="project-error" role="alert" hidden></p>
        <button id="cancel" class="ui-button" type="button">取消</button>
        <button class="ui-button" data-variant="primary" type="submit">新建</button>
      </footer>
    </form>
    <script type="module" src="/src/new-project-window.ts"></script>
  </body>
</html>

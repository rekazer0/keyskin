<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'" />
    <link rel="stylesheet" href="/src/tokens.css" />
    <link rel="stylesheet" href="/src/components.css" />
    <link rel="stylesheet" href="/src/picker.css" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <title>图片选择</title>
  </head>
  <body class="picker-window">
    <header class="ui-pane-header picker-toolbar">
      <button id="picker-back" class="ui-icon-button" type="button" title="返回全部图片" aria-label="返回" hidden><span data-icon="arrow-left" aria-hidden="true"></span></button>
      <span id="picker-style" hidden></span>
      <h2 id="picker-title">图片选择</h2>
      <span id="picker-count" class="ui-badge" data-variant="pill" hidden></span>
      <div class="ui-pane-header-actions">
        <label class="ui-input ui-search" hidden><span class="ui-input-affix" data-icon="search" aria-hidden="true"></span><input id="resource-search" type="text" aria-label="搜索" /></label>
        <button id="picker-close" class="ui-icon-button" type="button" title="关闭" aria-label="关闭" hidden><span data-icon="x" aria-hidden="true"></span></button>
      </div>
    </header>
    <main>
      <section id="image-picker-view" class="image-picker-view" hidden>
        <div class="picker-canvas-stage"><canvas id="picker-canvas" class="ui-checker" width="720" height="420" aria-label="原始图片切片选择器"></canvas></div>
      </section>
      <section id="style-library-view" class="style-library-view" hidden>
        <div class="style-library-bar">
          <div id="style-library-modes" class="ui-segmented" role="group" aria-label="内容类型">
            <button type="button" data-library-mode="styles" aria-pressed="true">全部样式</button>
            <button type="button" data-library-mode="images" aria-pressed="false">全部图片</button>
          </div>
          <div id="style-library-kinds"></div>
          <div id="style-library-filters"></div>
        </div>
        <div id="style-library-grid" class="style-library-grid" role="listbox" aria-label="全部样式"></div>
        <div id="style-library-empty" class="style-library-empty" role="status" hidden></div>
        <section id="style-library-preview" class="style-library-preview" aria-label="所选资源预览" hidden>
          <div id="style-library-preview-image" class="style-library-preview-image ui-checker"></div>
          <div class="style-library-preview-info">
            <strong id="style-library-preview-title"></strong>
            <small id="style-library-preview-meta"></small>
            <div class="style-library-preview-actions">
              <button id="style-library-apply" class="ui-button" data-variant="primary" type="button">应用</button>
              <button id="style-library-slice" class="ui-button" type="button" hidden>选择切片</button>
              <button id="style-library-edit" class="ui-icon-button" type="button" title="编辑" data-shortcut="单击" aria-label="编辑"><span data-icon="pencil" aria-hidden="true"></span></button>
            </div>
          </div>
          <button id="style-library-preview-close" class="ui-icon-button" type="button" title="关闭预览" aria-label="关闭预览"><span data-icon="x" aria-hidden="true"></span></button>
        </section>
      </section>
    </main>
    <script type="module" src="/src/picker-window.ts"></script>
  </body>
</html>

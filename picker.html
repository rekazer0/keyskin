<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'" />
    <link rel="stylesheet" href="/src/tokens.css" />
    <link rel="stylesheet" href="/src/components.css" />
    <link rel="stylesheet" href="/src/picker.css" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <title>图片选择</title>
  </head>
  <body class="picker-window">
    <header class="picker-toolbar">
      <button id="picker-back" class="picker-back" type="button" aria-label="切换至全部图片" hidden>
        <span class="picker-back-icon" data-icon="chevron-left" data-icon-size="16" aria-hidden="true"></span>
        <span id="picker-back-label">全部图片</span>
      </button>
      <div class="picker-heading">
        <span id="picker-style" hidden></span>
        <strong id="picker-title">图片选择</strong>
        <span id="picker-subtitle"></span>
      </div>
      <div class="picker-actions">
        <input id="resource-search" type="search" results="0" placeholder="搜索图片资源" aria-label="搜索图片资源" hidden />
        <button id="picker-close" class="ui-icon-button" type="button" title="关闭" aria-label="关闭" data-icon="x" data-icon-size="16" hidden></button>
      </div>
    </header>
    <main>
      <section id="image-picker-view" class="image-picker-view" hidden>
        <div class="picker-canvas-stage"><canvas id="picker-canvas" width="720" height="420" aria-label="原始图片切片选择器"></canvas></div>
      </section>
      <section id="style-library-view" class="style-library-view" hidden>
        <div class="style-library-bar">
          <div class="style-library-segmented" role="group" aria-label="内容类型">
            <button type="button" data-library-mode="styles" aria-pressed="true">全部样式</button>
            <button type="button" data-library-mode="images" aria-pressed="false">全部图片</button>
          </div>
          <div id="style-library-kinds"></div>
          <div id="style-library-filters"></div>
          <button id="style-library-add" class="style-library-add" type="button" title="新增样式" aria-label="新增样式">＋</button>
        </div>
        <div id="style-library-grid" class="style-library-grid"></div>
        <p id="style-library-empty" class="style-library-empty" role="status" hidden></p>
        <section id="style-library-preview" class="style-library-preview" aria-label="所选资源预览" hidden>
          <div id="style-library-preview-image" class="style-library-preview-image"></div>
          <div class="style-library-preview-info">
            <strong id="style-library-preview-title"></strong>
            <small id="style-library-preview-meta"></small>
            <div>
              <button id="style-library-apply" type="button">应用到当前项</button>
              <button id="style-library-edit" type="button">编辑</button>
              <button id="style-library-preview-close" type="button">关闭预览</button>
            </div>
          </div>
        </section>
        <footer class="style-library-footer"><span id="style-library-status"></span><span id="style-library-source"></span></footer>
      </section>
      <section id="resource-picker-view" class="resource-picker-view" hidden>
        <div id="resource-picker-grid" class="resource-picker-grid"></div>
        <p id="resource-empty" hidden>没有匹配的图片资源</p>
      </section>
    </main>
    <script type="module" src="/src/picker-window.ts"></script>
  </body>
</html>

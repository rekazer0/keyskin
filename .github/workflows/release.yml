name: release

on:
  push:
    tags:
      - "v*"
    # dev 分支只出安卓和 Windows 测试包，作为 Actions 产物上传，不建 Release
    branches:
      - dev

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - run: npm ci
      - run: npm run verify
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  create-release:
    needs: check
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" >/dev/null 2>&1 && exit 0
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v version="$VERSION" '
            $0 ~ "^## " version "([[:space:]]|$)" { printing = 1 }
            printing && $0 ~ "^## " && $0 !~ "^## " version "([[:space:]]|$)" { exit }
            printing { print }
          ' CHANGELOG.md > release-notes.md
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --title "键设 KeySkin ${{ github.ref_name }}" \
            --notes-file release-notes.md

  build-tauri:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
          - platform: macos-15-intel
            target: x86_64-apple-darwin
            bundles: dmg
          - platform: windows-latest
            bundles: nsis
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Install Rust target
        if: matrix.target != ''
        run: rustup target add ${{ matrix.target }}
      - name: Install frontend dependencies
        run: npm ci
      - name: Build bundles
        shell: bash
        run: |
          ARGS="--bundles ${{ matrix.bundles }}"
          if [ -n "${{ matrix.target }}" ]; then ARGS="$ARGS --target ${{ matrix.target }}"; fi
          npm run tauri build -- $ARGS
      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET: ${{ matrix.target }}
        run: |
          if [ -n "$TARGET" ]; then
            cd "src-tauri/target/$TARGET/release/bundle"
          else
            cd src-tauri/target/release/bundle
          fi
          shopt -s nullglob
          if [ "$RUNNER_OS" = "macOS" ]; then
            DMGS=(dmg/*.dmg)
            test "${#DMGS[@]}" -gt 0
            ARCH="${TARGET%%-*}"
            OUTPUT="KeySkin-${GITHUB_REF_NAME}-${ARCH}.dmg"
            cp "${DMGS[0]}" "$OUTPUT"
            gh release upload "${{ github.ref_name }}" \
              "$OUTPUT" \
              --repo "${{ github.repository }}" --clobber
          else
            EXES=(nsis/*.exe)
            test "${#EXES[@]}" -gt 0
            OUTPUT="KeySkin-${GITHUB_REF_NAME}-x64-setup.exe"
            cp "${EXES[0]}" "$OUTPUT"
            gh release upload "${{ github.ref_name }}" \
              "$OUTPUT" \
              --repo "${{ github.repository }}" --clobber
          fi

  # dev 分支出 Windows 测试包，作为 Actions 产物上传
  build-windows-dev:
    needs: check
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run tauri build -- --bundles nsis
      - name: Upload dev Windows build
        uses: actions/upload-artifact@v4
        with:
          name: KeySkin-windows-dev-${{ github.sha }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/*.exe

  build-android:
    needs: [check, create-release]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: 27.0.12077973
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          # The default also installs the legacy `tools` package, which the SDK repository no longer serves.
          packages: platform-tools
      - name: Install Android NDK
        run: sdkmanager "ndk;$NDK_VERSION"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - run: npm ci
      - name: Initialize Android project
        run: NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION" npm run tauri -- android init --ci --skip-targets-install
      - name: Sync Android launcher icons
        run: node scripts/sync-android-icons.mjs
      - name: Configure APK signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/android-release.jks"
          node <<'NODE'
          const fs = require("node:fs")
          const path = "src-tauri/gen/android/app/build.gradle.kts"
          let gradle = fs.readFileSync(path, "utf8")
          const replacements = [
            ["    buildTypes {\n", `    signingConfigs {
                  create("release") {
                      storeFile = file(System.getenv("ANDROID_KEYSTORE_FILE"))
                      storePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias = System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
                  }
              }
              buildTypes {
          `],
            ["        getByName(\"release\") {\n", "        getByName(\"release\") {\n            signingConfig = signingConfigs.getByName(\"release\")\n"]
          ]
          for (const [before, after] of replacements) {
            if (!gradle.includes(before)) throw new Error(`Missing Gradle marker: ${before}`)
            gradle = gradle.replace(before, after)
          }
          fs.writeFileSync(path, gradle)
          NODE
      - name: Build signed APK
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/android-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION" npm run tauri -- android build --apk --split-per-abi --target aarch64 --ci
      - name: Upload dev APK
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: KeySkin-dev-${{ github.sha }}
          path: src-tauri/gen/android/app/build/outputs/apk/**/*-release.apk
      - name: Upload APK
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mapfile -t APKS < <(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' ! -name '*unsigned*')
          test "${#APKS[@]}" -gt 0
          for APK in "${APKS[@]}"; do
            ABI=$(basename "$APK" | sed -E 's/^app-(.*)-release\.apk$/\1/')
            OUTPUT="KeySkin-${GITHUB_REF_NAME}-${ABI}.apk"
            cp "$APK" "$OUTPUT"
            gh release upload "$GITHUB_REF_NAME" "$OUTPUT" \
              --repo "$GITHUB_REPOSITORY" --clobber
          done

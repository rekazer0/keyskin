[package]
name = "keyskin"
version = "2.0.0-beta7"
description = "百度、搜狗与手心输入法皮肤编辑器"
edition = "2021"

[lib]
name = "keyskin_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[profile.release]
strip = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
reqwest = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = { version = "2", features = ["watch"] }
tauri-plugin-native-share = { path = "native-share" }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSBitmapImageRep", "NSImage", "NSImageRep"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSData", "NSDictionary", "NSString"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-version = "0.1.7"
windows-sys = { version = "0.61", features = ["Win32_UI_Input_KeyboardAndMouse"] }
